name: GLaDOS Check-in
run-name: GLaDOS ${{ inputs.checkin_day || github.event_name }} ${{ inputs.final_attempt && 'final recovery' || 'checkin' }}

on:
  workflow_dispatch:
    inputs:
      force_checkin:
        description: 'Force checkin even if already completed today (debugging only)'
        type: boolean
        required: false
        default: false
      final_attempt:
        description: 'Report a non-authentication failure as the final recovery attempt'
        type: boolean
        required: false
        default: false
      checkin_day:
        description: 'Optional Asia/Shanghai day (YYYY-MM-DD); stale recovery requests expire'
        type: string
        required: false
        default: ''
  schedule:
    # UTC: 01:18 and 04:18 = Asia/Shanghai: 09:18 and 12:18.
    - cron: '18 1 * * *'
    - cron: '18 4 * * *'

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  daily:
    name: Decide whether checkin is needed
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test daily decision on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: python3 -B -m unittest discover -s tests -v

      - name: Check today's successful checkin history
        id: guard
        run: python3 tools/daily_checkin_guard.py
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_CHECKIN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_checkin || false }}
          CHECKIN_DAY: ${{ inputs.checkin_day || '' }}

  checkin:
    name: GLaDOS checkin
    continue-on-error: true
    needs: daily
    if: needs.daily.outputs.should_run == 'true'
    outputs:
      exit_code: ${{ steps.attempt.outputs.exit_code }}
      attempt_outcome: ${{ steps.attempt.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Random delay for scheduled runs
        if: github.event_name == 'schedule'
        env:
          JITTER_MAX_SECONDS: ${{ vars.GLADOS_JITTER_MAX_SECONDS || '900' }}
        run: |
          python3 - <<'PY'
          import os
          import random
          import time

          maximum = int(os.environ['JITTER_MAX_SECONDS'])
          if not 0 <= maximum <= 900:
              raise ValueError('GLADOS_JITTER_MAX_SECONDS must be between 0 and 900')
          delay = random.SystemRandom().randint(0, maximum)
          print(f'Scheduled run: waiting {delay} seconds before checkin', flush=True)
          time.sleep(delay)
          PY

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test authentication classification on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: python -B -m unittest discover -s runtime_tests -v

      - name: Running checkin
        id: attempt
        run: |
          set +e
          python checkin.py
          checkin_exit=$?
          echo "exit_code=$checkin_exit" >> "$GITHUB_OUTPUT"
          exit "$checkin_exit"
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          GLADOS_VERBOSE: 'false'
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}

  keepalive:
    name: Keep scheduled workflow active
    continue-on-error: true
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep alive
        uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1

  notification:
    name: Report actionable checkin failures
    continue-on-error: ${{ needs.checkin.outputs.exit_code != '2' && !(github.event_name == 'workflow_dispatch' && inputs.final_attempt) }}
    needs: [daily, checkin]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Report notification decision
        run: python3 tools/checkin_notification_policy.py
        env:
          DAILY_SHOULD_RUN: ${{ needs.daily.outputs.should_run }}
          CHECKIN_OUTCOME: ${{ needs.checkin.outputs.attempt_outcome }}
          CHECKIN_EXIT_CODE: ${{ needs.checkin.outputs.exit_code }}
          CHECKIN_SCHEDULE: ${{ github.event.schedule }}
          CHECKIN_FINAL_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.final_attempt || false }}
