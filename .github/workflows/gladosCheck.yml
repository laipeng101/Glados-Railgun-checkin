name: auto check

on:
  workflow_dispatch:
  schedule:
    # UTC: 01:18 and 04:18 = Asia/Shanghai: 09:18 and 12:18.
    - cron: '18 1,4 * * *'

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: GLaDOS checkin
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Random delay for scheduled runs
        if: github.event_name == 'schedule'
        env:
          JITTER_MAX_SECONDS: ${{ vars.GLADOS_JITTER_MAX_SECONDS || '900' }}
        run: |
          python3 - <<'PY'
          import os
          import random
          import time

          maximum = int(os.environ['JITTER_MAX_SECONDS'])
          if not 0 <= maximum <= 900:
              raise ValueError('GLADOS_JITTER_MAX_SECONDS must be between 0 and 900')
          delay = random.SystemRandom().randint(0, maximum)
          print(f'Scheduled run: waiting {delay} seconds before checkin', flush=True)
          time.sleep(delay)
          PY

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Running checkin
        run: python checkin.py
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          GLADOS_VERBOSE: 'false'
          PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}

  keepalive:
    name: Keep scheduled workflow active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep alive
        uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
